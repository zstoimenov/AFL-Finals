name: Update AFL data

on:
  schedule:
    # AWST is UTC+8 and has no daylight saving, so these are fixed all year:
    # 10:17, 15:17 and 21:43 AWST Thursday to Sunday, and the evening one alone
    # from Monday to Wednesday.
    #
    # Squiggle is not the constraint here — a handful of requests a day against
    # a courtesy limit of roughly one a second is a rounding error, and the data
    # changes slowly. The real cost is on our side: every refresh that finds a
    # change writes a commit to main and chains a full Pages deploy, so polling
    # hourly would mean 24 commits and 24 builds a day to catch results that
    # land in three predictable windows. So the schedule follows the football
    # rather than the clock — the overnight results, the afternoon's games and
    # the evening's, with anything finishing later picked up next morning.
    #
    # The odd minutes are deliberate. GitHub's cron is best effort and queues
    # behind every other repository on the shared scheduler; slots on the exact
    # hour are the most contended. Every run of the previous ':00' schedule
    # started 3h41m to 6h21m late, every day for a week. Minutes away from the
    # hour (and from :15/:30/:45) measurably shorten that queue. It does not
    # make delivery punctual — nothing does, on a public runner — so treat these
    # as "no earlier than", and never assume a run has happened because its
    # time has passed.
    - cron: '17 2,7 * * 4,5,6,0'
    - cron: '43 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Squiggle snapshot
        run: node scripts/fetch-data.mjs
      # Weather is a separate provider, so a bad day at Open-Meteo must not cost
      # us the football data that has already been written.
      - name: Fetch kickoff forecasts
        continue-on-error: true
        run: node scripts/fetch-weather.mjs
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh AFL data snapshot"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN never fire on:push workflows (GitHub's
      # recursion guard), so the Pages deploy must be chained explicitly.
      # Only deploy from the default branch — a data refresh run on a feature
      # branch (e.g. to preview real data) must not publish it to production.
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
